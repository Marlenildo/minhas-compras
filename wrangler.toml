# App (pasta app/) e servidor de busca (worker/) no mesmo Worker do Cloudflare.
# Com o repositório conectado ao Cloudflare (Workers → minhas-compras → Settings → Build),
# cada envio ao GitHub publica tudo sozinho.
name = "minhas-compras"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"
# Mantém as variáveis e segredos cadastrados no painel (SERPAPI_KEY, ML_CLIENT_ID...)
keep_vars = true

# Arquivos do app: o endereço principal abre app/index.html; /api/* vai sempre para o servidor
[assets]
directory = "./app"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
ORIGENS_PERMITIDAS = "*"
CACHE_HORAS = "6"
# Endereços do app para onde o login com Google pode voltar (separados por vírgula)
ORIGENS_APP = "https://compras.marlenildo.online,https://minhas-compras.marlenildo.workers.dev"

# Armazenamento do cache e dos tokens: namespace KV "minhas-compras-tokens".
[[kv_namespaces]]
binding = "TOKENS"
id = "27d3555857e84b7397e86c93049e5b4c"

# Banco das contas (usuários, sessões, salvos): D1 "minhas-compras". As tabelas são criadas sozinhas.
[[d1_databases]]
binding = "DB"
database_name = "minhas-compras"
database_id = "67594694-6b16-452e-9649-da28856ed703"

[observability]
enabled = true
